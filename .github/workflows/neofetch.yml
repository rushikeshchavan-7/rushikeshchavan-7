name: Update neofetch card

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/neofetch.py"
      - "assets/neofetch/ascii-art.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/neofetch.py
      - name: Commit if changed
        run: |
          git config user.name "rushikeshchavan-7"
          git config user.email "157344215+rushikeshchavan-7@users.noreply.github.com"
          git add assets/neofetch
          git diff --cached --quiet || (git commit -m "Update neofetch card" && git push)
