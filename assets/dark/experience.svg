ght="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6" >Enterprise banking · CareEdge</text><text x="300" y="244" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >Production features in .NET Core, Angular, Oracle SQL and PostgreSQL. TDD with</text><text x="300" y="268" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >xUnit; shared component library refactor removed 30% duplicate code.</text></g><g class="up" style="animation-delay:0.90s"><text x="40" y="354" font-size="14.5" font-weight="500" fill="#86868b" text-anchor="start" >Jun 2023 — Jun 2024</text><circle cx="262" cy="348" r="7" fill="#161617" stroke="#f5f5f7" stroke-width="2.5"/><text x="300" y="356" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6" >Vice President · Rotaract</text><text x="300" y="388" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >Led flagship projects such as Maitri 7.0 and Saraswati Open 2024, end to end.</text></g><g class="up" style="animation-delay:1.25s"><text x="40" y="474" font-size="14.5" font-weight="500" fill="#86868b" text-anchor="start" >Sep 2022 — Dec 2022</text><circle cx="262" cy="468" r="7" fill="#161617" stroke="#f5f5f7" stroke-width="2.5"/><text x="300" y="476" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6" >Web development</text><text x="300" y="508" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >Client websites and a full blog platform with Node.js and Next.js.</text></g><g class="up" style="animation-delay:1.60s"><text x="40" y="594" font-size="14.5" font-weight="500" fill="#86868b" text-anchor="start" >Jan 2022 — May 2022</text><circle cx="262" cy="588" r="7" fill="#161617" stroke="#f5f5f7" stroke-width="2.5"/><text x="300" y="596" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6" >Where it started</text><text x="300" y="628" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >Six computer-vision and AI projects in five months: drones, ArUco, drowsiness</text><text x="300" y="652" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" >and road-sign detection.</text></g><g class="up" style="animation-delay:2s"><path d="M40 726H960" stroke="#2a2a2d"/><rect x="40" y="748" width="318" height="36" rx="18" fill="#1d1d1f"/><text x="55" y="771" font-size="14.5" font-weight="500" fill="#f5f5f7" text-anchor="start" >🏆 Emerging Engineer of the Year FY26</text><rect x="368" y="748" width="230" height="36" rx="18" fill="#1d1d1f"/><text x="383" y="771" font-size="14.5" font-weight="500" fill="#f5f5f7" text-anchor="start" >🏆 Rookie of the Year FY26</text><rect x="608" y="748" width="174" height="36" rx="18" fill="#1d1d1f"/><text x="623" y="771" font-size="14.5" font-weight="500" fill="#f5f5f7" text-anchor="start" >🏆 Hats Off FY25 Q4</text></g>
